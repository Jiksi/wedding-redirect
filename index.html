<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index,follow">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Undangan Spesial">
  <meta property="og:title" content="Undangan Spesial">
  <meta property="og:description" content="Dengan penuh kebahagiaan, Anda kami undang untuk membuka undangan spesial ini.">
  <meta property="og:image" content="https://wedding-redirect.pages.dev/assets/preview.svg">
  <meta property="og:image:secure_url" content="https://wedding-redirect.pages.dev/assets/preview.svg">
  <meta property="og:image:type" content="image/svg+xml">
  <meta property="og:url" content="https://wedding-redirect.pages.dev/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Undangan Spesial">
  <meta name="twitter:description" content="Dengan penuh kebahagiaan, Anda kami undang untuk membuka undangan spesial ini.">
  <meta name="twitter:image" content="https://wedding-redirect.pages.dev/assets/preview.svg">
  <title>Undangan Spesial</title>
  <meta name="theme-color" content="#f7f2e9">
  <style>
    :root { color-scheme: light; --ink:#3e342d; --muted:#786b60; --paper:#f7f2e9; --gold:#ad8955; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--paper); color:var(--ink); font-family:Georgia,"Times New Roman",serif; }
    main { width:min(100%,520px); text-align:center; padding:48px 28px; border:1px solid #d8c9b4; background:rgba(255,255,255,.48); }
    .eyebrow { color:var(--gold); letter-spacing:.24em; text-transform:uppercase; font:11px Arial,sans-serif; }
    h1 { font-weight:400; font-size:clamp(32px,8vw,48px); margin:20px 0 12px; }
    p { color:var(--muted); line-height:1.7; font:14px/1.7 Arial,sans-serif; }
    a { display:inline-block; margin-top:18px; padding:13px 24px; background:var(--ink); color:white; text-decoration:none; font:12px Arial,sans-serif; letter-spacing:.12em; text-transform:uppercase; }
    .small { margin-top:26px; font-size:11px; color:#998b7c; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">You are invited</div>
    <h1>Undangan Spesial</h1>
    <p>Dengan penuh kebahagiaan, Anda kami undang untuk membuka undangan spesial ini.</p>
    <p id="status">Anda akan segera diarahkan…</p>
    <a id="continue" href="https://youtu.be/Qgkq2iOzYzI?si=omC1Ngw7Ao9pmzgG" rel="noopener noreferrer">Buka Undangan</a>
    <div class="small">Terima kasih atas perhatian Anda</div>
  </main>
  <script>
    // Change this URL when reusing the repository for another invitation.
    const DESTINATION_URL = "https://youtu.be/Qgkq2iOzYzI?si=omC1Ngw7Ao9pmzgG";
    const REDIRECT_DELAY_MS = 900;
    const destination = new URL(DESTINATION_URL);
    if (!["https:", "http:"].includes(destination.protocol)) {
      throw new Error("Redirect destination must use HTTP or HTTPS.");
    }
    document.getElementById("continue").href = destination.href;
    window.setTimeout(() => window.location.replace(destination.href), REDIRECT_DELAY_MS);
  </script>
</body>
</html>
